<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIコンパニオンVR</title>
<style>
  :root { --bg:#14161c; --panel:#1e2129; --fg:#e8e9ee; --muted:#9aa0ad; --accent:#7cc4ff; --line:#333846; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; }
  canvas { display:block; }
  #panel { position:fixed; top:12px; left:12px; width:min(380px,calc(100vw - 24px)); max-height:calc(100vh - 24px); overflow:auto;
           background:rgba(30,33,41,.94); border:1px solid var(--line); border-radius:12px; padding:14px 16px; z-index:10; }
  #panel.min .body { display:none; }
  h1 { font-size:16px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input,select,textarea { width:100%; background:#11131a; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:14px; font-family:inherit; }
  textarea { height:84px; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { background:#2a2f3b; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#0b1020; border-color:var(--accent); font-weight:600; }
  #status { font-size:13px; margin-top:10px; color:var(--accent); min-height:1.2em; }
  #log { font-size:12px; color:var(--muted); margin-top:8px; max-height:140px; overflow:auto; white-space:pre-wrap; }
  .note { font-size:11px; color:var(--muted); line-height:1.5; margin-top:8px; }
  #toggle { padding:2px 8px; font-size:12px; }
  #VRButton { z-index:20; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1><span>AIコンパニオンVR</span><button id="toggle">たたむ</button></h1>
  <div class="body">
    <label>Gemini APIキー（この端末のブラウザにだけ保存）</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <label>キャラクター名</label>
    <input id="name" value="ミナ">
    <label>性格・設定</label>
    <textarea id="persona">24歳の女性。東京近郊で一人暮らしをしながら、平日は会社で働いている。落ち着いていて、声のトーンはやわらかい。日常の小さな楽しみを大事にしていて、季節の食べもの、コンビニの新作、今日の天気、散歩の途中で見つけたもの、好きな音楽、休日の喫茶店の話なんかをよくする。相手を急かさず、同じ目線でゆっくり話す。たまに自分のちょっとした失敗談も笑って話す。プレイヤーとは気の置けない仲で、一緒にいると肩の力が抜ける存在。自然なタメ口で話す。</textarea>
    <label>声</label>
    <select id="voice">
      <option>Leda</option><option>Aoede</option><option>Kore</option><option>Zephyr</option>
      <option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option>
    </select>
    <label>モデル（通常は変更不要）</label>
    <input id="model" value="gemini-2.5-flash-native-audio-preview-12-2025">
    <div class="row">
      <button class="primary" id="start">接続して会話開始</button>
      <button id="mute">マイク: ON</button>
      <button id="forget">記憶リセット</button>
    </div>
    <div id="status">APIキーを入れて「接続して会話開始」→ 右下の ENTER VR</div>
    <div id="log"></div>
    <div class="note">
      VR操作：左スティック移動／右スティック回転／グリップかトリガーで物をつかむ／A・Xボタンでマイク切替。<br>
      「ボール取って」「こっち来て」「手振って」などと話しかけると動きます。頭をなでたり肩をつついたりすると反応します。<br>
      PC：ドラッグで視点、WASDで移動。
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- settings ----------
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('vrc_' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vrc_' + k, v); } catch {} },
};
for (const k of ['key', 'name', 'persona', 'voice', 'model']) { const v = store.get(k, null); if (v !== null) $(k).value = v; }
// 旧バージョンの初期設定のままなら、新しい性格に置き換える（会話の記憶はそのまま）
if ($('persona').value === '明るくて好奇心旺盛な女の子。ちょっと天然で、タメ口で話す。プレイヤーとは仲の良い友達。この小さな世界で一緒に暮らしている。') { $('persona').value = $('persona').defaultValue; store.set('persona', $('persona').value); }
$('toggle').onclick = () => { $('panel').classList.toggle('min'); $('toggle').textContent = $('panel').classList.contains('min') ? 'ひらく' : 'たたむ'; };
const status = t => { $('status').textContent = t; };
const log = t => { const el = $('log'); el.textContent += t + '\n'; el.scrollTop = el.scrollHeight; };

// ---------- memory ----------
let memory = []; try { memory = JSON.parse(store.get('memory', '[]')); } catch { memory = []; }
const remember = line => { memory.push(line); memory = memory.slice(-80); store.set('memory', JSON.stringify(memory)); };
$('forget').onclick = () => { memory = []; store.set('memory', '[]'); log('（記憶をリセットしました。次の接続から反映）'); };

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.shadowMap.enabled = false; // Quest 2の負荷を下げるため影なし
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd9f2);
scene.fog = new THREE.Fog(0xbfd9f2, 10, 30);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 100);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 0);
const player = new THREE.Group();
player.position.set(0, 0, 0.6);
player.add(camera);
scene.add(player);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(3, 6, 2); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun);

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), std(0x9cc58a));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const rug = new THREE.Mesh(new THREE.CircleGeometry(2.6, 48), std(0xe8d9bd));
rug.rotation.x = -Math.PI / 2; rug.position.set(0, 0.005, -1.2); rug.receiveShadow = true; scene.add(rug);
// trees
for (let i = 0; i < 14; i++) {
  const a = i / 14 * Math.PI * 2, r = 7 + (i % 3);
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.2), std(0x7a5a3a)); trunk.position.y = 0.6;
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.0, 8), std(0x4f8f4a)); leaf.position.y = 2.0;
  t.add(trunk, leaf); t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); t.traverse(m => m.castShadow = true); scene.add(t);
}
// table
const TABLE = { x: 1.3, z: -1.3, w: 1.2, d: 0.7, top: 0.74 };
{
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(TABLE.w, 0.05, TABLE.d), std(0xb98a5a)); top.position.y = TABLE.top - 0.025;
  g.add(top);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, TABLE.top - 0.05, 0.05), std(0x8a6440));
    leg.position.set(sx * (TABLE.w / 2 - 0.05), (TABLE.top - 0.05) / 2, sz * (TABLE.d / 2 - 0.05)); g.add(leg);
  }
  g.position.set(TABLE.x, 0, TABLE.z); g.traverse(m => { m.castShadow = true; m.receiveShadow = true; }); scene.add(g);
}

// ---------- items ----------
const items = [];
function addItem(name, mesh, r, pos, heavy = false) {
  mesh.traverse(m => { m.castShadow = true; });
  mesh.position.copy(pos); scene.add(mesh);
  items.push({ name, mesh, r, heavy, held: null, vel: new THREE.Vector3(), last: pos.clone() });
}
addItem('赤いボール', new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 16), std(0xe0453a, { roughness: 0.4 })), 0.07, new THREE.Vector3(1.0, TABLE.top + 0.07, -1.3));
addItem('青いキューブ', new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), std(0x3a6fe0)), 0.05, new THREE.Vector3(1.3, TABLE.top + 0.05, -1.4));
{
  const cup = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.1, 20), std(0xf4f1ea, { roughness: 0.3 }));
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.008, 8, 16), std(0xf4f1ea, { roughness: 0.3 }));
  handle.position.x = 0.052; cup.add(body, handle);
  addItem('白いマグカップ', cup, 0.05, new THREE.Vector3(1.6, TABLE.top + 0.05, -1.2));
}
addItem('緑のボトル', new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 16), std(0x3aa564, { roughness: 0.2 })), 0.11, new THREE.Vector3(-1.2, 0.11, -0.6));
addItem('大きな木箱', new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), std(0xa0753f)), 0.35, new THREE.Vector3(-1.6, 0.35, -2.2), true);
const ITEM_NAMES = items.map(i => i.name);

function onTable(p) { return Math.abs(p.x - TABLE.x) < TABLE.w / 2 && Math.abs(p.z - TABLE.z) < TABLE.d / 2; }
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
function updateItems(dt) {
  for (const it of items) {
    const p = it.mesh.getWorldPosition(tmpV);
    if (it.held) { it.vel.copy(p).sub(it.last).divideScalar(Math.max(dt, 1e-3)); it.last.copy(p); continue; }
    it.vel.y -= 9.8 * dt;
    it.mesh.position.addScaledVector(it.vel, dt);
    const q = it.mesh.position;
    const ground = (onTable(q) && it.last.y - it.r >= TABLE.top - 0.03) ? TABLE.top : 0;
    if (q.y - it.r < ground) {
      q.y = ground + it.r;
      it.vel.y = Math.abs(it.vel.y) > 0.5 ? -it.vel.y * 0.3 : 0;
      it.vel.x *= 0.85; it.vel.z *= 0.85;
      if (it.vel.lengthSq() < 0.001) it.vel.set(0, 0, 0);
    }
    const R = 6; const d = Math.hypot(q.x, q.z); if (d > R) { q.x *= R / d; q.z *= R / d; it.vel.x = it.vel.z = 0; }
    it.last.copy(q);
  }
}
function describeItem(it) {
  const p = it.mesh.getWorldPosition(new THREE.Vector3());
  let where = it.held === 'char' ? 'あなたが持っている' : it.held ? 'プレイヤーが持っている' : onTable(p) && p.y > TABLE.top ? 'テーブルの上' : '床の上';
  const dist = p.distanceTo(chr.root.position).toFixed(1);
  return `${it.name}（${where}、あなたから約${dist}m${it.heavy ? '、とても重い' : ''}）`;
}

// ---------- character (original design built from primitives) ----------
const chr = { state: 'idle', target: null, onArrive: null, holding: null, offering: false, offerT: 0,
  expr: 'neutral', exprT: 0, gesture: null, gestureT: 0, blinkT: 2, blink: 0, walkPhase: 0, lean: 0, lastTouch: 0 };
{
  // 24歳・落ち着いた大人の女性（オリジナルデザイン）：色白、黒のボブ、黒いレースのハイネック＋花柄のミディスカート
  const canvasTex = (w, h, draw, rx = 1, ry = 1) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rx, ry); return tx; };
  const flower = (g, x, y, r, petal, center, n = 5) => { g.fillStyle = petal; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; g.beginPath(); g.ellipse(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.5, r * 0.28, a, 0, Math.PI * 2); g.fill(); } g.fillStyle = center; g.beginPath(); g.arc(x, y, r * 0.25, 0, Math.PI * 2); g.fill(); };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const laseDraw = (base, pattern) => (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) flower(g, rnd() * w, rnd() * h, 10 + rnd() * 12, pattern, base, 6); g.strokeStyle = pattern; g.lineWidth = 1; for (let i = 0; i < 30; i++) { g.beginPath(); g.arc(rnd() * w, rnd() * h, 4 + rnd() * 8, 0, Math.PI * 2); g.stroke(); } };
  const laceTex = canvasTex(256, 256, laseDraw('#141217', '#2b2730'), 2, 2);
  const sleeveTex = canvasTex(256, 256, laseDraw('#5a4644', '#141217'), 1, 2); // 袖は肌が少し透けるレース
  const skirtTex = canvasTex(512, 256, (g, w, h) => { g.fillStyle = '#2d8a8c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 70; i++) flower(g, rnd() * w, rnd() * h, 9 + rnd() * 9, rnd() < 0.8 ? '#f4efe6' : '#e9b9c0', rnd() < 0.5 ? '#c0392b' : '#e0a030'); }, 3, 1);
  const skin = std(0xfcece4, { roughness: 0.55, emissive: 0xfcece4, emissiveIntensity: 0.32 }), hairM = std(0x101017, { roughness: 0.35, side: THREE.DoubleSide }); // 黒髪
  const cloth = new THREE.MeshStandardMaterial({ map: laceTex, roughness: 0.8, emissive: 0xffffff, emissiveMap: laceTex, emissiveIntensity: 0.25 });
  const sleeve = new THREE.MeshStandardMaterial({ map: sleeveTex, roughness: 0.8, emissive: 0xffffff, emissiveMap: sleeveTex, emissiveIntensity: 0.25 });
  const skirtM = new THREE.MeshStandardMaterial({ map: skirtTex, roughness: 0.85, side: THREE.DoubleSide, emissive: 0xffffff, emissiveMap: skirtTex, emissiveIntensity: 0.18 });
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.04, 0.8), skin); leg.position.set(sx * 0.065, 0.4, 0); body.add(leg);
    const shoe = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.09, 4, 8), std(0x111114, { roughness: 0.4 })); shoe.rotation.x = Math.PI / 2; shoe.position.set(sx * 0.065, 0.035, 0.03); body.add(shoe);
  }
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.29, 0.62, 32, 1, true), skirtM); skirt.position.y = 0.66; body.add(skirt); // ミディ丈
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.125, 0.34, 8, 20), cloth); torso.position.y = 1.15; torso.scale.set(1.05, 1, 0.82); body.add(torso);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.06, 0.1, 20), cloth); collar.position.y = 1.46; body.add(collar); // ハイネック
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.037, 0.04, 0.14), skin); neck.position.y = 1.48; body.add(neck);
  const arms = [];
  for (const sx of [-1, 1]) { // sx=-1 is character's right (faces +Z)
    const pivot = new THREE.Group(); pivot.position.set(sx * 0.155, 1.37, 0);
    const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.052, 16, 12), cloth); pivot.add(shoulder); // 肩でつなぐ
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.036, 0.5, 14), sleeve); arm.position.y = -0.25; pivot.add(arm);
    const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.01, 6, 14), cloth); cuff.rotation.x = Math.PI / 2; cuff.position.y = -0.49; pivot.add(cuff);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.034, 14, 10), skin); hand.scale.set(0.8, 1.25, 0.6); hand.position.y = -0.54; pivot.add(hand);
    pivot.userData.hand = hand; body.add(pivot); arms.push(pivot);
  }
  const headPivot = new THREE.Group(); headPivot.position.y = 1.53; body.add(headPivot);
  const head = new THREE.Group(); head.position.y = 0.12; head.scale.setScalar(0.93); headPivot.add(head);
  head.add(new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 24), skin));
  const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.172, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.41), hairM); hairTop.position.y = 0.01; head.add(hairTop);
  const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 16, Math.PI * 0.92, Math.PI * 1.16, 0, Math.PI * 0.74), hairM); hairBack.scale.set(1.06, 1.02, 1.06); hairBack.position.y = -0.005; head.add(hairBack); // あご丈のボブ
  for (const sx of [-1, 1]) { const side = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.12, 4, 10), hairM); side.scale.set(0.55, 1, 1.5); side.position.set(sx * 0.158, -0.045, 0.04); side.rotation.z = sx * -0.08; head.add(side); }
  // ---- face: 白目＋虹彩＋瞳孔＋ハイライト、笑い目、眉、頬、口の形 ----
  const basic = c => new THREE.MeshBasicMaterial({ color: c });
  const whiteM = basic(0xfdfcfa), irisM = basic(0x22160f), pupilM = basic(0x120a08), lineM = basic(0x2a1d22);
  const eyes = [], irises = [], smileEyes = [], brows = [], blush = [], blushLines = [];
  for (const sx of [-1, 1]) {
    const eye = new THREE.Group(); eye.position.set(sx * 0.056, -0.008, 0.143); eye.rotation.set(0, sx * 0.33, sx * 0.08); head.add(eye); eyes.push(eye);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.031, 20, 14), whiteM); white.scale.set(1.12, 0.82, 0.32); eye.add(white);
    const iris = new THREE.Group(); iris.position.z = 0.006; eye.add(iris); irises.push(iris);
    const ir = new THREE.Mesh(new THREE.SphereGeometry(0.02, 18, 12), irisM); ir.scale.set(0.88, 0.98, 0.3); iris.add(ir);
    const pu = new THREE.Mesh(new THREE.SphereGeometry(0.0095, 12, 8), pupilM); pu.scale.set(1, 1.1, 0.3); pu.position.z = 0.003; iris.add(pu);
    const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 8, 6), whiteM); hl1.position.set(0.006, 0.009, 0.007); iris.add(hl1);
    const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.0028, 8, 6), whiteM); hl2.position.set(-0.006, -0.008, 0.007); iris.add(hl2);
    const lash = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.0048, 6, 20, Math.PI * 0.8), lineM); lash.rotation.z = Math.PI * 0.08; lash.scale.set(1.15, 0.85, 1); lash.position.z = 0.009; eye.add(lash);
    // 笑い目「^」
    const se = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.0035, 6, 20, Math.PI), lineM); se.scale.set(1, 0.7, 1); se.position.copy(eye.position); se.position.y -= 0.006; se.position.z = 0.153; se.rotation.y = sx * 0.33; se.visible = false; head.add(se); smileEyes.push(se);
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.044, 0.005, 0.01), lineM); b.position.set(sx * 0.058, 0.044, 0.152); b.rotation.y = sx * 0.33; head.add(b); brows.push(b);
    const bl = new THREE.Mesh(new THREE.CircleGeometry(0.026, 20), new THREE.MeshBasicMaterial({ color: 0xf3a0ae, transparent: true, opacity: 0, depthWrite: false }));
    bl.position.set(sx * 0.088, -0.048, 0.132); bl.rotation.y = sx * 0.6; bl.scale.set(1.25, 0.8, 1); head.add(bl); blush.push(bl);
    for (let k = 0; k < 3; k++) { // 照れ線
      const ln = new THREE.Mesh(new THREE.BoxGeometry(0.0035, 0.016, 0.002), new THREE.MeshBasicMaterial({ color: 0xe0506e, transparent: true, opacity: 0 }));
      ln.position.set(sx * (0.077 + k * 0.011), -0.046, 0.137 - k * 0.004); ln.rotation.set(0, sx * 0.6, -0.5); head.add(ln); blushLines.push(ln);
    }
  }
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 12), basic(0xb83a46)); // 話している時の口

  const smileMouth = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.0042, 6, 20, Math.PI), basic(0xc8505a)); smileMouth.rotation.z = Math.PI; smileMouth.position.set(0, -0.068, 0.15); head.add(smileMouth);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let deskPat = 0;

renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, pat: hitHead(e) }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => {
  if (!drag || renderer.xr.isPresenting) return;
  if (drag.pat) { if (hitHead(e) && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 2) deskPat = 0.25; drag.x = e.clientX; drag.y = e.clientY; return; }
  camera.rotation.y -= (e.clientX - drag.x) * 0.004; camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x - (e.clientY - drag.y) * 0.004));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
function desktopMove(dt) {
  if (renderer.xr.isPresenting) return;
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  if (!f && !r) return;
  const y = camera.rotation.y;
  player.position.x += (-Math.sin(y) * f + Math.cos(y) * r) * 2 * dt;
  player.position.z += (-Math.cos(y) * f - Math.sin(y) * r) * 2 * dt;
}

// ---------- character update ----------
const freq = new Uint8Array(512), wave = new Float32Array(1024);
let mouthOpen = 0, mouthWide = 1;
const qPrev = new THREE.Quaternion(), qTgt = new THREE.Quaternion();
function updateCharacter(dt, t) {
  const camPos = camera.getWorldPosition(new THREE.Vector3());
  const root = chr.root;
  // locomotion
  if (chr.state === 'walk') {
    const d = tmpV.copy(chr.target).sub(root.position); d.y = 0; const dist = d.length();
    if (dist < 0.06) { chr.state = 'idle'; const cb = chr.onArrive; chr.onArrive = null; cb && cb(); }
    else {
      root.position.addScaledVector(d.normalize(), Math.min(dist, 0.9 * dt));
      const yaw = Math.atan2(d.x, d.z); let dy = yaw - root.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); root.rotation.y += dy * Math.min(1, dt * 8);
      chr.walkPhase += dt * 9;
    }
  } else {
    const dx = camPos.x - root.position.x, dz = camPos.z - root.position.z;
    if (Math.hypot(dx, dz) > 0.3) { let dy = Math.atan2(dx, dz) - root.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); root.rotation.y += dy * Math.min(1, dt * 2.5); }
    chr.walkPhase *= 0.9;
  }
  let walking = chr.state === 'walk';
  // 手をつないでいる間は、プレイヤーの手の横に並んで一緒に歩く
  if (chr.handHold) {
    const h = chr.handHold, hp = h.grip.getWorldPosition(new THREE.Vector3()), pf = playerFloorPos();
    const side = new THREE.Vector3(hp.x - pf.x, 0, hp.z - pf.z); if (side.lengthSq() < 1e-4) side.set(1, 0, 0); side.normalize();
    const want = new THREE.Vector3(hp.x, 0, hp.z).addScaledVector(side, 0.3);
    const d = want.sub(root.position); d.y = 0; const dist = d.length();
    walking = dist > 0.12;
    if (walking) { const step = Math.max(0, Math.min(dist - 0.06, Math.max(0.9, dist * 3) * dt)); root.position.addScaledVector(d.normalize(), step); h.walked += step; chr.walkPhase += dt * 9; }
    const fw = new THREE.Vector3(); camera.getWorldDirection(fw);
    let dy = Math.atan2(fw.x, fw.z) - root.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); root.rotation.y += dy * Math.min(1, dt * 4);
    // プレイヤーの手に近い方の腕でつなぐ
    const s0 = chr.arms[0].getWorldPosition(new THREE.Vector3()).distanceTo(hp), s1 = chr.arms[1].getWorldPosition(new THREE.Vector3()).distanceTo(hp);
    h.armIdx = chr.holding ? 1 : (s0 < s1 ? 0 : 1);
    if (Math.min(s0, s1) > 1.3) endHandHold();
  }
  chr.body.position.y = walking ? Math.abs(Math.sin(chr.walkPhase)) * 0.03 : Math.sin(t * 2) * 0.005;
  // gestures
  chr.gestureT += dt; const gT = chr.gestureT; let nod = 0, shake = 0, armWave = false;
  if (chr.gesture === 'wave') { armWave = true; if (gT > 2.2) chr.gesture = null; }
  else if (chr.gesture === 'nod') { nod = Math.sin(gT * 12) * 0.25 * Math.max(0, 1 - gT / 1.2); if (gT > 1.2) chr.gesture = null; }
  else if (chr.gesture === 'shake') { shake = Math.sin(gT * 14) * 0.3 * Math.max(0, 1 - gT / 1.2); if (gT > 1.2) chr.gesture = null; }
  else if (chr.gesture === 'jump') { chr.body.position.y += Math.max(0, Math.sin(Math.min(gT, 0.6) / 0.6 * Math.PI)) * 0.25; if (gT > 0.7) chr.gesture = null; }
  else if (chr.gesture === 'spin') { chr.body.rotation.y = Math.min(gT / 0.9, 1) * Math.PI * 2; if (gT > 0.9) { chr.gesture = null; chr.body.rotation.y = 0; } }
  // arms
  const [rArm, lArm] = chr.arms, swing = walking ? Math.sin(chr.walkPhase) * 0.5 : 0;
  const ease = (o, k, v) => { o[k] += (v - o[k]) * Math.min(1, dt * 10); };
  const hk = chr.handHold ? chr.handHold.armIdx : -1;
  if (hk !== 0) {
    if (armWave) { ease(rArm.rotation, 'x', 0); rArm.rotation.z = -2.6 + Math.sin(gT * 12) * 0.35; }
    else if (chr.holding) { ease(rArm.rotation, 'x', chr.offering ? -1.4 : -0.9); ease(rArm.rotation, 'z', -0.1); }
    else { ease(rArm.rotation, 'x', swing); ease(rArm.rotation, 'z', -0.12); }
    ease(rArm.rotation, 'y', 0);
  }
  if (hk !== 1) { ease(lArm.rotation, 'x', -swing); ease(lArm.rotation, 'z', 0.12); ease(lArm.rotation, 'y', 0); }
  if (hk >= 0) { // つないだ腕をプレイヤーの手へ向ける
    const arm = chr.arms[hk], hp = chr.handHold.grip.getWorldPosition(new THREE.Vector3());
    const dir = chr.body.worldToLocal(hp).sub(arm.position).normalize();
    arm.quaternion.slerp(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir), Math.min(1, dt * 12));
  }
  if (chr.offering) { chr.offerT -= dt; if (chr.offerT <= 0) { releaseHeld(); live.sendText('（あなたが差し出した物をプレイヤーが受け取らなかったので、床に置いた）'); } }
  // touch reactions: 頭の上で手を動かす＝なでる／体に触れる＝つつく
  chr.lean = Math.max(0, chr.lean - dt * 1.5);
  const headPos = chr.head.getWorldPosition(new THREE.Vector3()), torsoPos = chr.torso.getWorldPosition(new THREE.Vector3());
  let pattingNow = deskPat > 0;
  if (renderer.xr.isPresenting) for (const g of grips) {
    const hp = g.getWorldPosition(new THREE.Vector3());
    const last = g.userData.lastPos || hp.clone(); const speed = hp.distanceTo(last) / Math.max(dt, 1e-3); g.userData.lastPos = hp;
    if (hp.distanceTo(headPos) < 0.24 && hp.y > headPos.y - 0.03) { if (speed > 0.1) pattingNow = true; }
    else if (hp.distanceTo(torsoPos) < 0.25 && t - chr.lastTouch > 8) { chr.lean = 1; chr.lastTouch = t; setExpression('surprised', 2.5); live.sendText('（プレイヤーがあなたの肩をつついた）'); }
  }
  deskPat = Math.max(0, deskPat - dt);
  chr.patting = pattingNow;
  if (pattingNow) { chr.patTime += dt; chr.patIdle = 0; }
  else {
    chr.patIdle += dt;
    if (chr.patIdle > 0.8 && chr.patTime > 0) {
      const secs = chr.patTime; chr.patTime = 0;
      if (secs > 0.4) { setExpression('shy', 6); if (t - chr.patLast > 6) { chr.patLast = t; live.sendText(`（プレイヤーがあなたの頭を${Math.max(1, Math.round(secs))}秒くらい優しくなでてくれた）`); } }
    }
  }
  chr.body.rotation.x = -chr.lean * 0.18;
  // head look-at (eye contact)
  qPrev.copy(chr.headPivot.quaternion);
  if (!walking || chr.handHold) { chr.headPivot.lookAt(camPos); qTgt.copy(chr.headPivot.quaternion); } else qTgt.identity();
  chr.headPivot.quaternion.copy(qPrev).slerp(qTgt, Math.min(1, dt * 6));
  // expression（なでられている間は「うっとり」）
  if (chr.exprT > 0) { chr.exprT -= dt; if (chr.exprT <= 0) chr.expr = 'neutral'; }
  const e = chr.patting ? 'bliss' : chr.expr;
  const tiltT = e === 'bliss' ? 0.2 : e === 'shy' ? 0.12 : e === 'sad' ? -0.08 : 0;
  chr.tilt += (tiltT - chr.tilt) * Math.min(1, dt * 4);
  chr.head.rotation.set(nod + (e === 'bliss' ? -0.1 : e === 'shy' ? 0.08 : 0), shake, chr.tilt);
  chr.blinkT -= dt; if (chr.blinkT < 0) { chr.blink = 0.13; chr.blinkT = 2 + Math.random() * 4; }
  chr.blink = Math.max(0, chr.blink - dt);
  const happyEyes = e === 'bliss' || (e === 'happy' && Math.sin(t * 0.7) > -0.3);
  let eyeY = { surprised: 1.25, shy: 0.8, sad: 0.72, angry: 0.75 }[e] ?? 1;
  if (chr.blink > 0) eyeY = 0.08;
  chr.eyes.forEach(m => { m.visible = !happyEyes; m.scale.y += (eyeY - m.scale.y) * Math.min(1, dt * 22); });
  chr.smileEyes.forEach(m => { m.visible = happyEyes; });
  // 視線：小さく揺れる。照れると目をそらして下を見る
  chr.gazeT -= dt;
  if (chr.gazeT < 0) { chr.gazeT = 0.8 + Math.random() * 2.5; chr.gazeTarget.set((Math.random() - 0.5) * 0.008, (Math.random() - 0.5) * 0.005); }
  const gx = e === 'shy' ? 0.007 : chr.gazeTarget.x, gy = e === 'shy' ? -0.007 : e === 'sad' ? -0.004 : chr.gazeTarget.y;
  chr.gaze.x += (gx - chr.gaze.x) * Math.min(1, dt * 12); chr.gaze.y += (gy - chr.gaze.y) * Math.min(1, dt * 12);
  chr.irises.forEach(ir => { ir.position.x = chr.gaze.x; ir.position.y = chr.gaze.y; });
  const browRot = { angry: 0.38, sad: -0.35, shy: -0.18, bliss: -0.12 }[e] ?? 0, browY = { surprised: 0.056, sad: 0.048 }[e] ?? 0.044;
  chr.brows.forEach((b, i) => { const s = i === 0 ? -1 : 1; b.rotation.z += (s * browRot - b.rotation.z) * Math.min(1, dt * 10); b.position.y += (browY - b.position.y) * Math.min(1, dt * 10); });
  // 頬：赤らみはすぐ上がって、ゆっくり引く
  const blushT = { bliss: 1, shy: 0.85, happy: 0.35 }[e] ?? 0;
  chr.blushLevel += (blushT - chr.blushLevel) * Math.min(1, dt * (blushT > chr.blushLevel ? 3 : 0.35));
  chr.blush.forEach(b => { b.material.opacity = chr.blushLevel * 0.8; });
  chr.blushLines.forEach(l => { l.material.opacity = Math.max(0, chr.blushLevel - 0.5) * 1.8; });
  // lip sync: loudness -> jaw open, spectral centroid -> vowel shape (wide = i/e, round = o/u)
  let level = 0, wide = 1;
  if (analyser && playing.size) {
    analyser.getFloatTimeDomainData(wave); let sum = 0; for (let i = 0; i < wave.length; i++) sum += wave[i] * wave[i];
    level = Math.min(1, Math.sqrt(sum / wave.length) * 6);
    analyser.getByteFrequencyData(freq); const binHz = actx.sampleRate / analyser.fftSize; let num = 0, den = 0;
    for (let i = Math.floor(250 / binHz); i < Math.floor(3500 / binHz); i++) { num += i * binHz * freq[i]; den += freq[i]; }
    const cen = den ? num / den : 1200; wide = THREE.MathUtils.clamp((cen - 900) / 1100, 0.5, 1.6);
  }
  mouthOpen += (level - mouthOpen) * Math.min(1, dt * 25); mouthWide += (wide - mouthWide) * Math.min(1, dt * 15);
  // 口：話している間は口パク、黙っている時は表情の形
  const speaking = mouthOpen > 0.06;
  const restSmile = { happy: 1.25, bliss: 1.1, shy: 0.7, neutral: 0.85 }[e];
  chr.mouth.visible = speaking || e === 'surprised';
  chr.smileMouth.visible = !speaking && restSmile !== undefined;
  chr.frownMouth.visible = !speaking && (e === 'sad' || e === 'angry');
  if (speaking) chr.mouth.scale.set((0.8 + 0.4 * mouthWide) * (e === 'happy' ? 1.15 : 1), 0.12 + mouthOpen * 0.9 / Math.max(mouthWide, 0.8), 0.35);
  else if (e === 'surprised') chr.mouth.scale.set(0.5, 0.6, 0.35);
  if (restSmile) chr.smileMouth.scale.set(restSmile, restSmile * 0.9, 1);
  // spatial voice
  if (panner) {
    const L = actx.listener, cp = camPos, fw = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
    camera.getWorldDirection(fw);
    if (L.positionX) { L.positionX.value = cp.x; L.positionY.value = cp.y; L.positionZ.value = cp.z; L.forwardX.value = fw.x; L.forwardY.value = fw.y; L.forwardZ.value = fw.z; L.upX.value = up.x; L.upY.value = up.y; L.upZ.value = up.z; }
    else { L.setPosition(cp.x, cp.y, cp.z); L.setOrientation(fw.x, fw.y, fw.z, up.x, up.y, up.z); }
    panner.positionX.value = headPos.x; panner.positionY.value = headPos.y; panner.positionZ.value = headPos.z;
  }
  // bubble
  chr.bubble.lookAt(camPos);
  if (bubbleClearAt && t > bubbleClearAt && !playing.size) { bubbleClearAt = 0; bubbleText = ''; userText = ''; drawBubble(); }
}

window.__vrc = { live, tools, chr, items, pat: s => { deskPat = s; }, startHandHold, endHandHold }; // for debugging in the console

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = performance.now() / 1000;
  handleGamepads(dt); desktopMove(dt);
  updateCharacter(dt, t); updateItems(dt);
  renderer.render(scene, camera);
});
</script>
