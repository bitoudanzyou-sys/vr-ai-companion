<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>窓際の席</title>
<style>
  :root { --bg:#1a1613; --glass:rgba(28,24,21,.72); --fg:#f3ece3; --muted:#b9ada0; --accent:#e8b980; --line:rgba(255,255,255,.12); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
  canvas { display:block; }
  button { font:inherit; color:var(--fg); background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:999px; padding:9px 16px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.14); }
  button.primary { background:var(--accent); color:#2a1d10; border-color:var(--accent); font-weight:700; }
  input, select, textarea { font:inherit; color:var(--fg); background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .glass { background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); }

  /* 入店画面 */
  #enter { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(40,30,22,.55), rgba(10,8,6,.85)); }
  #enter .card { padding:32px 36px; border-radius:20px; text-align:center; max-width:420px; margin:16px; }
  #enter h1 { font-weight:500; letter-spacing:.2em; margin:0 0 8px; font-size:24px; }
  #enter p { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 20px; }
  #enter .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* 上部 */
  #top { position:fixed; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; z-index:10; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #pill { padding:7px 14px; border-radius:999px; font-size:13px; display:flex; align-items:center; gap:8px; }
  #pill .dot { width:8px; height:8px; border-radius:50%; background:#777; }
  #pill.on .dot { background:#7fd18b; }
  #pill.talking .dot { background:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #topRight { display:flex; gap:8px; align-items:center; padding:6px 8px; border-radius:999px; }
  #topRight label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; padding:0 6px; }
  #topRight select { padding:5px 8px; border-radius:999px; font-size:13px; }
  #topRight input[type=range] { width:80px; accent-color:var(--accent); }
  #topRight button { padding:6px 12px; font-size:13px; }

  /* 下部の会話バー */
  #bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); width:min(720px, calc(100vw - 24px)); display:flex; gap:8px; align-items:center; padding:8px; border-radius:999px; z-index:10; }
  #mic { width:46px; height:46px; padding:0; flex:none; position:relative; }
  #mic svg { width:20px; height:20px; vertical-align:middle; }
  #mic.off { opacity:.55; }
  #mic.off::after { content:""; position:absolute; left:10px; right:10px; top:50%; height:2px; background:#f08a7a; transform:rotate(-45deg); }
  #mic .ring { position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--accent); opacity:0; transition:opacity .08s, transform .08s; pointer-events:none; }
  #msg { flex:1; min-width:0; border-radius:999px; padding:12px 16px; background:rgba(0,0,0,.3); border:none; }
  #send { flex:none; }
  #orderBtn { flex:none; }

  /* 注文 */
  #order { position:fixed; bottom:84px; left:50%; transform:translateX(-50%); width:min(460px, calc(100vw - 24px)); padding:16px; border-radius:18px; z-index:12; display:none; }
  #order.open { display:block; }
  #order h3 { margin:0 0 10px; font-weight:500; font-size:15px; letter-spacing:.1em; }
  #drinks { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; }
  #drinks button { border-radius:12px; text-align:left; padding:10px 12px; }
  #drinks small { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  #order.iz { width:min(720px, calc(100vw - 24px)); }
  #tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  #tabs button { padding:6px 12px; font-size:13px; }
  #tabs button.on { background:var(--accent); color:#2a1d10; border-color:var(--accent); }
  #order.iz #drinks { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); max-height:min(52vh, 420px); overflow:auto; }
  #drinks .card { padding:0; overflow:hidden; text-align:left; border-radius:12px; }
  #drinks .card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#2a221c; }
  #drinks .card div { padding:7px 10px 9px; font-size:13px; }
  #drinks .card .price { float:right; color:var(--accent); font-size:12px; }
  #order .opt { margin-top:12px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }

  /* 設定 */
  #settings { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
  #settings.open { display:flex; }
  #settings .card { width:min(460px, calc(100vw - 24px)); max-height:calc(100vh - 32px); overflow:auto; padding:20px; border-radius:18px; }
  #settings h2 { margin:0 0 6px; font-size:17px; font-weight:500; }
  #settings label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  #settings input, #settings select, #settings textarea { width:100%; }
  #settings textarea { height:110px; resize:vertical; }
  #settings .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  #log { font-size:12px; color:var(--muted); margin-top:10px; max-height:150px; overflow:auto; white-space:pre-wrap; background:rgba(0,0,0,.25); border-radius:10px; padding:8px; }
  .note { font-size:12px; color:var(--muted); line-height:1.6; margin-top:10px; }
  #topLeft { display:flex; gap:8px; align-items:center; }
  #placeTag { padding:7px 14px; border-radius:999px; font-size:13px; color:var(--accent); }
  #storyBtn.glow { animation:glow 1.6s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 0 6px rgba(232,185,128,.22); background:rgba(232,185,128,.32); } }
  #storyBox { position:fixed; left:50%; bottom:88px; transform:translateX(-50%); width:min(620px, calc(100vw - 24px)); padding:18px 20px; border-radius:18px; z-index:12; display:none; }
  #storyBox.open { display:block; }
  #storyTitle { font-size:12px; color:var(--accent); letter-spacing:.15em; margin-bottom:8px; }
  #storyNarr { font-size:15px; line-height:1.85; }
  #storyLine { font-size:13px; color:var(--muted); margin-top:6px; }
  #choices { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  #choices button { border-radius:12px; text-align:left; padding:11px 14px; }
  #map { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
  #map.open { display:flex; }
  #map .card { width:min(640px, calc(100vw - 24px)); padding:18px; border-radius:18px; }
  #map h2 { margin:0 0 10px; font-size:17px; font-weight:500; letter-spacing:.1em; }
  #mapArea { position:relative; aspect-ratio:16/10; border-radius:14px; overflow:hidden; background:#efe6d6; }
  #mapArea svg { position:absolute; inset:0; width:100%; height:100%; }
  #mapArea button { position:absolute; transform:translate(-50%,-50%); background:#2a221c; color:#f3ece3; border:none; font-size:13px; padding:7px 13px; white-space:nowrap; }
  #mapArea button.here { background:var(--accent); color:#2a1d10; }
  #mapArea button.locked { opacity:.35; }
  #mapArea .ev { color:var(--accent); margin-left:4px; }
  #mapArea button.here .ev { color:#7a3b10; }
  #rel { margin-top:12px; font-size:13px; color:var(--muted); letter-spacing:.05em; }
  #map .row { display:flex; justify-content:flex-end; margin-top:10px; }
  #reflect { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
  #reflect.open { display:flex; }
  #reflect .card { width:min(560px, calc(100vw - 24px)); max-height:calc(100vh - 32px); overflow:auto; padding:20px; border-radius:18px; }
  #reflect h2 { margin:0 0 14px; font-size:17px; font-weight:500; } #reflect h2 small { font-size:12px; color:var(--muted); margin-left:6px; }
  #reflect h3 { font-size:13px; color:var(--muted); font-weight:500; margin:16px 0 6px; }
  .axis { display:grid; grid-template-columns:72px 1fr 72px; align-items:center; gap:10px; margin:10px 0; font-size:13px; }
  .axis span:last-child { text-align:right; }
  .axis .track { position:relative; height:6px; border-radius:3px; background:rgba(255,255,255,.12); }
  .axis .knob { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); }
  #reflectText { font-size:14px; line-height:1.8; margin:14px 0 0; }
  #answers { margin:0; padding-left:18px; font-size:12px; color:var(--muted); line-height:1.8; }
  #reflect .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; transition:opacity .45s; pointer-events:none; z-index:50; }
  #fade.on { opacity:1; }
  #toast { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); padding:8px 14px; border-radius:999px; font-size:13px; z-index:11; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  #VRButton { top:70px !important; bottom:auto !important; left:14px !important; width:auto !important; padding:8px 14px !important; font-size:12px !important; }
  @media (max-width:560px) { #topRight label span { display:none; } #orderBtn span { display:none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="enter">
  <div class="card glass">
    <h1>窓際の席</h1>
    <p>都内の小さなカフェ。<br>向かいの席で、ミナが待っています。</p>
    <div class="row">
      <button class="primary" id="enterBtn">お店に入る</button>
      <button id="enterSettings">設定</button>
    </div>
    <p class="note" id="enterNote" style="margin:14px 0 0"></p>
  </div>
</div>

<div id="top">
  <div id="topLeft"><div id="pill" class="glass"><span class="dot"></span><span id="pillText">準備中</span></div><div id="placeTag" class="glass">カフェ</div></div>
  <div id="topRight" class="glass">
    <label><span>時間</span>
      <select id="timeSel">
        <option value="auto">いまの時刻</option><option value="day">昼</option><option value="evening">夕方</option><option value="night">夜</option>
      </select>
    </label>
    <label><span>BGM</span><input id="bgmVol" type="range" min="0" max="100" value="35"></label>
    <button id="openReflect">ふりかえり</button>
    <button id="openSettings">設定</button>
  </div>
</div>

<div id="bar" class="glass">
  <button id="mic" title="マイクのオン・オフ"><span class="ring"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <input id="msg" placeholder="声で話すか、ここに文字で書いてください" autocomplete="off">
  <button id="send">送る</button>
  <button id="mapBtn">地図</button>
  <button id="storyBtn" style="display:none">物語</button>
  <button id="orderBtn">注文<span>する</span></button>
</div>
<div id="toast" class="glass"></div>
<div id="storyBox" class="glass"><div id="storyTitle"></div><div id="storyNarr"></div><div id="storyLine"></div><div id="choices"></div></div>
<div id="map"><div class="card glass">
  <h2>街の地図</h2>
  <div id="mapArea"><svg viewBox="0 0 160 100" preserveAspectRatio="none">
    <path d="M0 74 C40 70 70 92 110 86 S150 92 160 90 L160 100 L0 100 Z" fill="#9cc3d9"/>
    <ellipse cx="112" cy="22" rx="26" ry="15" fill="#b9d3a0"/><ellipse cx="104" cy="25" rx="6" ry="4" fill="#9cc3d9"/>
    <g stroke="#cdbfa8" stroke-width="3" fill="none"><path d="M0 40 H160"/><path d="M70 0 V100"/><path d="M10 0 L50 100"/><path d="M100 40 L120 100"/></g>
    <rect x="88" y="60" width="26" height="9" fill="#b7b0a6"/><rect x="28" y="54" width="30" height="5" fill="#d9b48a"/>
  </svg></div>
  <div id="rel"></div>
  <div class="row"><button id="closeMap">閉じる</button></div>
</div></div>
<div id="reflect"><div class="card glass">
  <h2>ふりかえり　<small>これまでの答えから見える、いまのあなた</small></h2>
  <div id="axes"></div>
  <p id="reflectText"></p>
  <h3>あなたの答え</h3><ul id="answers"></ul>
  <div class="row"><button class="primary" id="askMina">ミナと話してみる</button><button id="closeReflect">閉じる</button></div>
</div></div>
<div id="fade"></div>

<div id="order" class="glass">
  <h3 id="menuTitle">メニュー</h3>
  <div id="tabs"></div>
  <div id="drinks"></div>
  <label class="opt"><input type="checkbox" id="orderForMina" checked> ミナの飲み物も頼む（ミナが自分で選ぶ）</label>
</div>

<div id="settings">
  <div class="card glass">
    <h2>設定</h2>
    <label>Gemini APIキー（この端末のブラウザにだけ保存）</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <label>名前</label>
    <input id="name" value="ミナ">
    <label>性格・設定</label>
    <textarea id="persona">24歳の女性。東京近郊で一人暮らしをしながら、平日は会社で働いている。落ち着いていて、声のトーンはやわらかい。日常の小さな楽しみを大事にしていて、季節の食べもの、コンビニの新作、今日の天気、散歩の途中で見つけたもの、好きな音楽、休日の喫茶店の話なんかをよくする。相手を急かさず、同じ目線でゆっくり話す。たまに自分のちょっとした失敗談も笑って話す。プレイヤーとは気の置けない仲で、一緒にいると肩の力が抜ける存在。自然なタメ口で話す。</textarea>
    <label>声</label>
    <select id="voice">
      <option>Leda</option><option>Aoede</option><option>Kore</option><option>Zephyr</option>
      <option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option>
    </select>
    <label>モデル（通常は変更不要）</label>
    <input id="model" value="gemini-2.5-flash-native-audio-preview-12-2025">
    <div class="row">
      <button class="primary" id="saveSettings">保存してつなぎ直す</button>
      <button id="forget">記憶リセット</button>
      <button id="resetStory">物語を最初から</button>
      <button id="closeSettings">閉じる</button>
    </div>
    <div id="log"></div>
    <div class="note">ドラッグで店内を見回せます。ミナの頭をドラッグするとなでられます。マイクのボタンで声のオン・オフ、文字で送ると声で返事が来ます。</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ================= 設定・記憶 =================
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('vrc_' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('vrc_' + k, v); } catch {} },
};
const FIELDS = ['key', 'name', 'persona', 'voice', 'model'];
for (const k of FIELDS) { const v = store.get(k, null); if (v !== null) $(k).value = v; }
if ($('persona').value.startsWith('明るくて好奇心旺盛な女の子')) { $('persona').value = $('persona').defaultValue; store.set('persona', $('persona').value); }
const log = t => { const el = $('log'); el.textContent += t + '\n'; el.scrollTop = el.scrollHeight; };
const charName = () => $('name').value.trim() || 'ミナ';
let memory = []; try { memory = JSON.parse(store.get('memory', '[]')); } catch { memory = []; }
const remember = line => { memory.push(line); memory = memory.slice(-80); store.set('memory', JSON.stringify(memory)); };
let toastTimer = 0;
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); };
const pill = (text, cls = '') => { $('pillText').textContent = text; $('pill').className = 'glass ' + cls; };

// ================= 描画の土台 =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
navigator.xr?.isSessionSupported?.('immersive-vr').then(ok => { if (ok) document.body.appendChild(VRButton.createButton(renderer)); }).catch(() => {});

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a221c);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.03, 60);
camera.rotation.order = 'YXZ';
const player = new THREE.Group(); player.position.set(0, 0, 0.95); player.add(camera); scene.add(player);
camera.position.set(0, 1.24, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
const basic = c => new THREE.MeshBasicMaterial({ color: c });
const canvasTex = (w, h, draw, rx = 1, ry = 1) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rx, ry); tx.anisotropy = 4; return tx;
};
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const groups = { cafe: new THREE.Group(), street: new THREE.Group(), park: new THREE.Group(), station: new THREE.Group(), izakaya: new THREE.Group(), river: new THREE.Group() };
for (const g of Object.values(groups)) scene.add(g);
let P = scene, LOCS = {}, curLoc = store.get('loc', 'cafe');
const add = (geo, mat, x, y, z, parent = P) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };

// ================= カフェ =================
P = groups.cafe;
const ROOM = { x0: -3.4, x1: 3.4, z0: -1.9, z1: 4.6, h: 3.0 };
const lights = {};
{
  // 床：木のフローリング
  const floorTex = canvasTex(512, 512, (g, w, h) => {
    const rows = 8;
    for (let r = 0; r < rows; r++) {
      let x = -rnd() * 200;
      while (x < w) {
        const len = 160 + rnd() * 200, base = 90 + rnd() * 30;
        g.fillStyle = `rgb(${base + 40},${base + 8},${base - 30})`; g.fillRect(x, r * h / rows, len, h / rows);
        g.strokeStyle = 'rgba(40,24,12,.55)'; g.lineWidth = 2; g.strokeRect(x, r * h / rows, len, h / rows);
        for (let k = 0; k < 6; k++) { g.strokeStyle = 'rgba(60,35,15,.12)'; g.beginPath(); const yy = r * h / rows + rnd() * h / rows; g.moveTo(x, yy); g.lineTo(x + len, yy + (rnd() - .5) * 6); g.stroke(); }
        x += len;
      }
    }
  }, 5, 5);
  const floor = add(new THREE.PlaneGeometry(ROOM.x1 - ROOM.x0, ROOM.z1 - ROOM.z0), std(0xffffff, { map: floorTex, roughness: 0.65 }), 0, 0, (ROOM.z0 + ROOM.z1) / 2);
  floor.rotation.x = -Math.PI / 2;
  const ceil = add(new THREE.PlaneGeometry(ROOM.x1 - ROOM.x0, ROOM.z1 - ROOM.z0), std(0x4a372a), 0, ROOM.h, (ROOM.z0 + ROOM.z1) / 2);
  ceil.rotation.x = Math.PI / 2;
  for (let i = 0; i < 5; i++) add(new THREE.BoxGeometry(ROOM.x1 - ROOM.x0, 0.12, 0.14), std(0x3a2a1f), 0, ROOM.h - 0.06, ROOM.z0 + 0.6 + i * 1.3); // 梁

  // 壁：しっくい調
  const plaster = std(0xece3d4, { roughness: 0.95 }), wainscot = std(0x6b4a33, { roughness: 0.7 });
  const W = ROOM.x1 - ROOM.x0, D = ROOM.z1 - ROOM.z0;
  const side = (x, rotY) => { const m = add(new THREE.PlaneGeometry(D, ROOM.h), plaster, x, ROOM.h / 2, (ROOM.z0 + ROOM.z1) / 2); m.rotation.y = rotY;
    const w = add(new THREE.BoxGeometry(0.03, 0.9, D), wainscot, x + (rotY > 0 ? 0.015 : -0.015), 0.45, (ROOM.z0 + ROOM.z1) / 2); return m; };

// ================= 毎フレームの動き =================
const freq = new Uint8Array(512), wave = new Float32Array(1024);
let mouthOpen = 0, mouthWide = 1;
const qPrev = new THREE.Quaternion(), qTgt = new THREE.Quaternion();
function updateCharacter(dt, t) {
  const camPos = camera.getWorldPosition(new THREE.Vector3());
  const speaking = playing.size > 0;
  // 待っている間のしぐさ：ときどき飲む／窓の外を見る

  if (chr.idleT < 0) { chr.idleT = 18 + Math.random() * 25; if (!speaking && !storyOpen) { if (MENUS[curLoc] && drinks.mina && drinks.mina.userData.level > 0.15 && Math.random() < 0.6) sip(); else chr.lookOutT = 2.5 + Math.random() * 2; } }
  chr.body.position.y = Math.sin(t * 1.6) * 0.003;

  if (chr.gesture === 'wave') { armWave = true; if (gT > 2.2) chr.gesture = null; }

  else if (chr.gesture) chr.gesture = null;

  const rest = LOCS[curLoc].rest;
  const restPos = sx => chr.root.localToWorld(rest === 'table' ? new THREE.Vector3(sx * 0.13, TABLE_TOP + 0.03, 0.34) : rest === 'lap' ? new THREE.Vector3(sx * 0.12, 0.56, 0.3) : new THREE.Vector3(sx * 0.2, 0.86, 0.04));
  // ひとくち飲む動き
  if (chr.sipT > 0) {
    chr.sipT -= dt; const p = chr.sipT, dr = chr.holdingCup;
    const mouthW = chr.root.localToWorld(new THREE.Vector3(0, (dr && DRINKS[dr.userData.name].tall !== undefined ? (DRINKS[dr.userData.name].tall ? 0.98 : 1.1) : DRINKS[dr ? dr.userData.name : 'ブレンドコーヒー'].kind === 'soda' ? 0.98 : 1.08), 0.24)), home = curLoc === 'izakaya' ? new THREE.Vector3(IZ_SPOT.mina[0], TABLE_TOP, IZ_SPOT.mina[1]) : SPOTS.mina.clone();
    const lift = p > 2.6 ? (3.2 - p) / 0.6 : p > 0.6 ? 1 : p / 0.6;
    if (dr) { dr.position.lerpVectors(home, mouthW, THREE.MathUtils.smoothstep(lift, 0, 1)); dr.rotation.x = -0.5 * THREE.MathUtils.smoothstep(lift, 0.6, 1); if (p < 1.6 && p > 1.5) setLevel(dr, dr.userData.level - 0.12); }
    reachTo(rArm, dr ? dr.position.clone().add(new THREE.Vector3(0.05, 0.03, 0)) : restPos(-1), k);
    if (p <= 0) { chr.sipT = 0; if (dr) { dr.position.copy(home); dr.rotation.x = 0; } chr.holdingCup = null; }
  } else if (armWave) { const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -2.5 + Math.sin(gT * 12) * 0.35)); rArm.quaternion.slerp(q, k); rArm.scale.y += (1 - rArm.scale.y) * k; }
  else reachTo(rArm, restPos(-1), k);
  reachTo(lArm, restPos(1), k);
  // さわったときの反応（PCではマウスで頭をなでる）
  const headPos = chr.head.getWorldPosition(new THREE.Vector3());
  let pattingNow = deskPat > 0; deskPat = Math.max(0, deskPat - dt);
  chr.patting = pattingNow;
  if (pattingNow) { chr.patTime += dt; chr.patIdle = 0; }
  else { chr.patIdle += dt; if (chr.patIdle > 0.8 && chr.patTime > 0) { const secs = chr.patTime; chr.patTime = 0; if (secs > 0.4) { setExpression('shy', 6); if (t - chr.patLast > 6) { chr.patLast = t; live.sendText(`（プレイヤーがテーブル越しに手を伸ばして、あなたの頭を${Math.max(1, Math.round(secs))}秒くらい優しくなでた）`); } } } }
  // 目線と顔の向き

  const lookTarget = chr.lookOutT > 0 ? chr.root.localToWorld(new THREE.Vector3(-1.6, 1.4, -1.0)) : chr.sipT > 0 ? chr.root.localToWorld(new THREE.Vector3(0, 1.0, 1.5)) : camPos;

  if (chr.exprT > 0) { chr.exprT -= dt; if (chr.exprT <= 0) chr.expr = 'neutral'; }

  const tiltT = (e === 'bliss' ? 0.2 : e === 'shy' ? 0.12 : e === 'sad' ? -0.08 : 0) + tiltG;
  chr.tilt += (tiltT - chr.tilt) * Math.min(1, dt * 4);
  chr.head.rotation.set(nod + (e === 'bliss' ? -0.1 : e === 'shy' ? 0.08 : 0), shake, chr.tilt);
  chr.blinkT -= dt; if (chr.blinkT < 0) { chr.blink = 0.13; chr.blinkT = 2 + Math.random() * 4; }
  chr.blink = Math.max(0, chr.blink - dt);
  const happyEyes = e === 'bliss' || chr.sipT > 0.8 && chr.sipT < 2.4 || (e === 'happy' && Math.sin(t * 0.7) > -0.3);
  let eyeY = { surprised: 1.25, shy: 0.8, sad: 0.72, angry: 0.75 }[e] ?? 1;
  if (chr.blink > 0) eyeY = 0.08;
  chr.eyes.forEach(m => { m.visible = !happyEyes; m.scale.y += (eyeY - m.scale.y) * Math.min(1, dt * 22); });
  chr.smileEyes.forEach(m => { m.visible = happyEyes; });
  chr.gazeT -= dt;
  if (chr.gazeT < 0) { chr.gazeT = 0.8 + Math.random() * 2.5; chr.gazeTarget.set((Math.random() - 0.5) * 0.008, (Math.random() - 0.5) * 0.005); }
  const gx = e === 'shy' ? 0.007 : chr.gazeTarget.x, gy = e === 'shy' ? -0.007 : e === 'sad' ? -0.004 : chr.gazeTarget.y;
  chr.gaze.x += (gx - chr.gaze.x) * Math.min(1, dt * 12); chr.gaze.y += (gy - chr.gaze.y) * Math.min(1, dt * 12);
  chr.irises.forEach(ir => { ir.position.x = chr.gaze.x; ir.position.y = chr.gaze.y; });
  const browRot = { angry: 0.38, sad: -0.35, shy: -0.18, bliss: -0.12 }[e] ?? 0, browY = { surprised: 0.056, sad: 0.048 }[e] ?? 0.044;
  chr.brows.forEach((b, i) => { const s = i === 0 ? -1 : 1; b.rotation.z += (s * browRot - b.rotation.z) * Math.min(1, dt * 10); b.position.y += (browY - b.position.y) * Math.min(1, dt * 10); });
  const blushT = { bliss: 1, shy: 0.85, happy: 0.35 }[e] ?? 0;
  chr.blushLevel += (blushT - chr.blushLevel) * Math.min(1, dt * (blushT > chr.blushLevel ? 3 : 0.35));
  chr.blush.forEach(b => { b.material.opacity = chr.blushLevel * 0.8; });
  chr.blushLines.forEach(l => { l.material.opacity = Math.max(0, chr.blushLevel - 0.5) * 1.8; });
  // 口パク：声の大きさで開き、音の高さで横長／丸を変える
  let level = 0, wide = 1;
  if (analyser && speaking) {
    analyser.getFloatTimeDomainData(wave); let sum = 0; for (let i = 0; i < wave.length; i++) sum += wave[i] * wave[i];
    level = Math.min(1, Math.sqrt(sum / wave.length) * 6);
    analyser.getByteFrequencyData(freq); const binHz = actx.sampleRate / analyser.fftSize; let num = 0, den = 0;
    for (let i = Math.floor(250 / binHz); i < Math.floor(3500 / binHz); i++) { num += i * binHz * freq[i]; den += freq[i]; }
    wide = THREE.MathUtils.clamp(((den ? num / den : 1200) - 900) / 1100, 0.5, 1.6);
  }
  mouthOpen += (level - mouthOpen) * Math.min(1, dt * 25); mouthWide += (wide - mouthWide) * Math.min(1, dt * 15);
  const talking = mouthOpen > 0.06, restSmile = { happy: 1.25, bliss: 1.1, shy: 0.7, neutral: 0.85 }[e];
  chr.mouth.visible = talking || e === 'surprised';
  chr.smileMouth.visible = !talking && restSmile !== undefined;
  chr.frownMouth.visible = !talking && (e === 'sad' || e === 'angry');
  if (talking) chr.mouth.scale.set((0.8 + 0.4 * mouthWide) * (e === 'happy' ? 1.15 : 1), 0.12 + mouthOpen * 0.9 / Math.max(mouthWide, 0.8), 0.35);
  else if (e === 'surprised') chr.mouth.scale.set(0.5, 0.6, 0.35);
  if (restSmile) chr.smileMouth.scale.set(restSmile, restSmile * 0.9, 1);
  // 声はミナの口元から聞こえる
  if (panner) {
    const L = actx.listener, fw = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
    camera.getWorldDirection(fw);
    if (L.positionX) { L.positionX.value = camPos.x; L.positionY.value = camPos.y; L.positionZ.value = camPos.z; L.forwardX.value = fw.x; L.forwardY.value = fw.y; L.forwardZ.value = fw.z; L.upX.value = up.x; L.upY.value = up.y; L.upZ.value = up.z; }
    else { L.setPosition(camPos.x, camPos.y, camPos.z); L.setOrientation(fw.x, fw.y, fw.z, up.x, up.y, up.z); }

  }

    if (speaking) pill(`${charName()}が話しています`, 'talking');
    else if (!muted && micLevel > 0.02) pill('聞いています…', 'on');
    else pill(muted ? 'マイクOFF・文字で話せます' : '会話中', 'on');
  }
  const ring = document.querySelector('#mic .ring'); const lv = muted ? 0 : Math.min(1, micLevel * 12);
  ring.style.opacity = lv > 0.08 ? 0.3 + lv * 0.7 : 0; ring.style.transform = `scale(${1 + lv * 0.25})`;
}
function updateDrinks(dt) {
  for (let i = deliveries.length - 1; i >= 0; i--) {
    const d = deliveries[i]; d.t -= dt;
    if (d.t <= 0) {
      deliveries.splice(i, 1); if (d.iz) { if (curLoc !== 'izakaya') continue; izPlace(d.who, d.name); } else placeDrink(d.who, d.name);
      if (d.who === 'mina') live.sendText(`（あなたが頼んだ${d.name}が届いた）`);
      else if (d.who === 'food') live.sendText(`（${d.name}がテーブルに届いた）`);
      else { toast(`${d.name}が届きました`); live.sendText(`（プレイヤーの${d.name}が届いた）`); }
    }
  }
  for (let i = growing.length - 1; i >= 0; i--) { const o = growing[i]; o.userData.grow = Math.min(1, o.userData.grow + dt * 2.5); o.scale.setScalar(THREE.MathUtils.smoothstep(o.userData.grow, 0, 1)); if (o.userData.grow >= 1) growing.splice(i, 1); }
  if (curLoc !== 'izakaya') for (const who of ['mina', 'player']) { const dr = drinks[who]; if (dr && dr.userData.grow < 1) { dr.userData.grow = Math.min(1, dr.userData.grow + dt * 2.5); dr.scale.setScalar(THREE.MathUtils.smoothstep(dr.userData.grow, 0, 1)); } }
  if (drinks.player && Math.random() < dt / 90) setLevel(drinks.player, drinks.player.userData.level - 0.1); // 自分のカップも少しずつ減っていく
}

$('mapBtn').onclick = () => { renderMap(); $('map').classList.add('open'); };
$('closeMap').onclick = () => $('map').classList.remove('open');
$('map').onclick = e => { if (e.target === $('map')) $('map').classList.remove('open'); };
$('storyBtn').onclick = openStory;
$('openReflect').onclick = () => { renderReflect(); $('reflect').classList.add('open'); };
$('closeReflect').onclick = () => $('reflect').classList.remove('open');
$('reflect').onclick = e => { if (e.target === $('reflect')) $('reflect').classList.remove('open'); };
$('askMina').onclick = askMinaReflect;
$('resetStory').onclick = () => { if (!confirm('物語を最初からやり直しますか？（会話の記憶はそのまま残ります）')) return; story = { ch: 'c1', aff: 0, flags: [], unlocked: ['cafe'], log: [], vals: {}, ver: 2 }; saveStory(); $('settings').classList.remove('open'); goTo('cafe', false); toast('物語を最初に戻しました'); };
addEventListener('keydown', e => { if (e.key === 'Escape') { $('map').classList.remove('open'); $('settings').classList.remove('open'); $('reflect').classList.remove('open'); } });
goTo(LOCS[curLoc] && story.unlocked.includes(curLoc) ? curLoc : 'cafe', false);

window.__vrc = { live, tools, chr, drinks, deliver, applyTime, goTo, openStory, story: () => story, pat: s => { deskPat = s; } };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = performance.now() / 1000;
  if (!renderer.xr.isPresenting) camera.rotation.set(pitch, yaw, 0);
  updateCharacter(dt, t); updateDrinks(dt);
  renderer.render(scene, camera);
});
